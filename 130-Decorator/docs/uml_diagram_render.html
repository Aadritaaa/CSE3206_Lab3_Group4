<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PixelWrap - Decorator Pattern UML Diagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }
    #container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      width: 1360px;
    }
    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 16px;
    }
    .title-bar h1 {
      font-size: 22px;
      color: #0f172a;
      font-weight: 700;
    }
    .title-bar span {
      background: #f1f5f9;
      color: #475569;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="container">
    <div class="title-bar">
      <div>
        <h1>PixelWrap — Decorator Pattern UML Class Diagram</h1>
        <p style="color: #64748b; font-size: 13px; margin-top: 4px;">Structural Design Pattern · CSE 3206 Lab 3</p>
      </div>
      <span>GoF Decorator Architecture</span>
    </div>

    <svg width="1280" height="660" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Drop Shadow Filter -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
        </filter>
        
        <!-- Triangle Marker for Generalization / Realization -->
        <marker id="arrow-triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
          <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#334155" stroke-width="1.8" stroke-linejoin="round"/>
        </marker>

        <!-- Aggregation Diamond Marker -->
        <marker id="diamond-aggregation" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto">
          <polygon points="1,6 8,1 15,6 8,11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- ========================================================================= -->
      <!-- RELATIONSHIP LINES (Rendered behind boxes)                                -->
      <!-- ========================================================================= -->

      <!-- 1. Realization: BaseImage to ImageProcessor -->
      <!-- Line from BaseImage top (x=210, y=140) up to y=60 then right to ImageProcessor (x=530, y=60) -->
      <path d="M 210 140 L 210 60 L 530 60" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-triangle)" />
      <text x="320" y="50" font-size="11.5" font-style="italic" fill="#64748b">implements</text>

      <!-- 2. Realization: ImageDecorator to ImageProcessor -->
      <!-- Line from ImageDecorator top (x=770, y=140) up to ImageProcessor bottom (x=770, y=95) -->
      <path d="M 770 140 L 770 100" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow-triangle)" />
      <text x="780" y="122" font-size="11.5" font-style="italic" fill="#64748b">implements</text>

      <!-- 3. Aggregation/Wrappee: ImageDecorator recursive wrappee reference to ImageProcessor -->
      <!-- Starts from right side of ImageDecorator with aggregation diamond, loops up and connects to right of ImageProcessor -->
      <path d="M 960 200 L 1040 200 L 1040 50 L 930 50" fill="none" stroke="#7c3aed" stroke-width="2" marker-start="url(#diamond-aggregation)" />
      <!-- Arrow pointing to ImageProcessor -->
      <polygon points="930,50 940,45 940,55" fill="#7c3aed" />
      <text x="1050" y="130" font-size="12" font-weight="bold" fill="#7c3aed">#wrappee</text>
      <text x="1050" y="148" font-size="11" fill="#6b21a8">1..* (wraps)</text>

      <!-- 4. Generalization Bus: 7 Concrete Decorators to ImageDecorator -->
      <!-- Central stem from ImageDecorator bottom (x=770, y=270) down to bus line y=340 -->
      <path d="M 770 270 L 770 340" fill="none" stroke="#334155" stroke-width="2" marker-start="url(#arrow-triangle)" />
      
      <!-- Horizontal Distribution Bus line at y=340 spanning across all 7 decorators (from x=95 to x=1185) -->
      <line x1="95" y1="340" x2="1185" y2="340" stroke="#334155" stroke-width="2" />

      <!-- Vertical drop lines to each of the 7 concrete decorators -->
      <line x1="95" y1="340" x2="95" y2="400" stroke="#334155" stroke-width="2" />
      <line x1="275" y1="340" x2="275" y2="400" stroke="#334155" stroke-width="2" />
      <line x1="455" y1="340" x2="455" y2="400" stroke="#334155" stroke-width="2" />
      <line x1="635" y1="340" x2="635" y2="400" stroke="#334155" stroke-width="2" />
      <line x1="815" y1="340" x2="815" y2="400" stroke="#334155" stroke-width="2" />
      <line x1="995" y1="340" x2="995" y2="400" stroke="#334155" stroke-width="2" />
      <line x1="1175" y1="340" x2="1175" y2="400" stroke="#334155" stroke-width="2" />


      <!-- ========================================================================= -->
      <!-- BOX 1: <<interface>> ImageProcessor (Component Interface)                -->
      <!-- ========================================================================= -->
      <g filter="url(#shadow)">
        <rect x="530" y="10" width="400" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
        <rect x="530" y="10" width="400" height="32" rx="8" fill="#dbeafe" />
        <rect x="530" y="34" width="400" height="8" fill="#dbeafe" />
        <text x="730" y="24" text-anchor="middle" font-size="11.5" font-style="italic" font-weight="600" fill="#1e40af">&lt;&lt;interface&gt;&gt;</text>
        <text x="730" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">ImageProcessor</text>
        <line x1="530" y1="42" x2="930" y2="42" stroke="#bfdbfe" stroke-width="1.5" />
        <text x="545" y="70" font-size="12.5" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process(): Promise&lt;JimpImage&gt;</text>
      </g>

      <!-- ========================================================================= -->
      <!-- BOX 2: BaseImage (Concrete Component)                                     -->
      <!-- ========================================================================= -->
      <g filter="url(#shadow)">
        <rect x="40" y="140" width="340" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
        <rect x="40" y="140" width="340" height="34" rx="8" fill="#dcfce7" />
        <rect x="40" y="166" width="340" height="8" fill="#dcfce7" />
        <text x="210" y="156" text-anchor="middle" font-size="11" font-style="italic" fill="#15803d">&lt;&lt;ConcreteComponent&gt;&gt;</text>
        <text x="210" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">BaseImage</text>
        <line x1="40" y1="174" x2="380" y2="174" stroke="#bbf7d0" stroke-width="1.5" />
        <!-- Attributes -->
        <text x="55" y="196" font-size="12" font-family="Consolas, monospace" fill="#334155">- imagePath: string</text>
        <line x1="40" y1="210" x2="380" y2="210" stroke="#bbf7d0" stroke-width="1.5" />
        <!-- Methods -->
        <text x="55" y="232" font-size="12" font-family="Consolas, monospace" fill="#0f172a">+ constructor(imagePath: string)</text>
        <text x="55" y="252" font-size="12" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process(): Promise&lt;JimpImage&gt;</text>
      </g>

      <!-- ========================================================================= -->
      <!-- BOX 3: <<abstract>> ImageDecorator (Abstract Decorator)                   -->
      <!-- ========================================================================= -->
      <g filter="url(#shadow)">
        <rect x="580" y="140" width="380" height="130" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2" />
        <rect x="580" y="140" width="380" height="34" rx="8" fill="#fef9c3" />
        <rect x="580" y="166" width="380" height="8" fill="#fef9c3" />
        <text x="770" y="156" text-anchor="middle" font-size="11" font-style="italic" fill="#a16207">&lt;&lt;abstract / Decorator&gt;&gt;</text>
        <text x="770" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">ImageDecorator</text>
        <line x1="580" y1="174" x2="960" y2="174" stroke="#fef08a" stroke-width="1.5" />
        <!-- Attributes -->
        <text x="595" y="196" font-size="12" font-family="Consolas, monospace" fill="#7c3aed" font-weight="bold"># wrappee: ImageProcessor</text>
        <line x1="580" y1="210" x2="960" y2="210" stroke="#fef08a" stroke-width="1.5" />
        <!-- Methods -->
        <text x="595" y="232" font-size="12" font-family="Consolas, monospace" fill="#0f172a">+ constructor(wrappee: ImageProcessor)</text>
        <text x="595" y="252" font-size="12" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process(): Promise&lt;JimpImage&gt;</text>
      </g>


      <!-- ========================================================================= -->
      <!-- CONCRETE DECORATORS (7 Boxes across the bottom row)                       -->
      <!-- ========================================================================= -->

      <!-- 1. GrayscaleDecorator -->
      <g filter="url(#shadow)">
        <rect x="15" y="400" width="160" height="150" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
        <rect x="15" y="400" width="160" height="28" rx="6" fill="#f1f5f9" />
        <rect x="15" y="420" width="160" height="8" fill="#f1f5f9" />
        <text x="95" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">GrayscaleDecorator</text>
        <line x1="15" y1="428" x2="175" y2="428" stroke="#e2e8f0" stroke-width="1" />
        <!-- Attributes -->
        <text x="25" y="448" font-size="10.5" font-family="Consolas, monospace" fill="#94a3b8">/* no options */</text>
        <line x1="15" y1="458" x2="175" y2="458" stroke="#e2e8f0" stroke-width="1" />
        <!-- Methods -->
        <text x="25" y="478" font-size="10" font-family="Consolas, monospace" fill="#334155">+ constructor(w)</text>
        <text x="25" y="498" font-size="10" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process()</text>
      </g>

      <!-- 2. BlurDecorator -->
      <g filter="url(#shadow)">
        <rect x="195" y="400" width="160" height="150" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
        <rect x="195" y="400" width="160" height="28" rx="6" fill="#f1f5f9" />
        <rect x="195" y="420" width="160" height="8" fill="#f1f5f9" />
        <text x="275" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">BlurDecorator</text>
        <line x1="195" y1="428" x2="355" y2="428" stroke="#e2e8f0" stroke-width="1" />
        <!-- Attributes -->
        <text x="205" y="448" font-size="10.5" font-family="Consolas, monospace" fill="#475569">- radius: number</text>
        <line x1="195" y1="458" x2="355" y2="458" stroke="#e2e8f0" stroke-width="1" />
        <!-- Methods -->
        <text x="205" y="478" font-size="10" font-family="Consolas, monospace" fill="#334155">+ constructor(w, r)</text>
        <text x="205" y="498" font-size="10" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process()</text>
      </g>

      <!-- 3. BorderDecorator -->
      <g filter="url(#shadow)">
        <rect x="375" y="400" width="160" height="150" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
        <rect x="375" y="400" width="160" height="28" rx="6" fill="#f1f5f9" />
        <rect x="375" y="420" width="160" height="8" fill="#f1f5f9" />
        <text x="455" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">BorderDecorator</text>
        <line x1="375" y1="428" x2="535" y2="428" stroke="#e2e8f0" stroke-width="1" />
        <!-- Attributes -->
        <text x="385" y="444" font-size="9.5" font-family="Consolas, monospace" fill="#475569">- thickness: num</text>
        <text x="385" y="456" font-size="9.5" font-family="Consolas, monospace" fill="#475569">- color: string</text>
        <line x1="375" y1="462" x2="535" y2="462" stroke="#e2e8f0" stroke-width="1" />
        <!-- Methods -->
        <text x="385" y="480" font-size="9.5" font-family="Consolas, monospace" fill="#334155">+ constructor(w,t,c)</text>
        <text x="385" y="498" font-size="10" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process()</text>
      </g>

      <!-- 4. BrightnessDecorator -->
      <g filter="url(#shadow)">
        <rect x="555" y="400" width="160" height="150" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
        <rect x="555" y="400" width="160" height="28" rx="6" fill="#f1f5f9" />
        <rect x="555" y="420" width="160" height="8" fill="#f1f5f9" />
        <text x="635" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">BrightnessDecorator</text>
        <line x1="555" y1="428" x2="715" y2="428" stroke="#e2e8f0" stroke-width="1" />
        <!-- Attributes -->
        <text x="565" y="448" font-size="10.5" font-family="Consolas, monospace" fill="#475569">- factor: number</text>
        <line x1="555" y1="458" x2="715" y2="458" stroke="#e2e8f0" stroke-width="1" />
        <!-- Methods -->
        <text x="565" y="478" font-size="10" font-family="Consolas, monospace" fill="#334155">+ constructor(w, f)</text>
        <text x="565" y="498" font-size="10" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process()</text>
      </g>

      <!-- 5. SepiaDecorator -->
      <g filter="url(#shadow)">
        <rect x="735" y="400" width="160" height="150" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
        <rect x="735" y="400" width="160" height="28" rx="6" fill="#f1f5f9" />
        <rect x="735" y="420" width="160" height="8" fill="#f1f5f9" />
        <text x="815" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">SepiaDecorator</text>
        <line x1="735" y1="428" x2="895" y2="428" stroke="#e2e8f0" stroke-width="1" />
        <!-- Attributes -->
        <text x="745" y="448" font-size="10.5" font-family="Consolas, monospace" fill="#94a3b8">/* no options */</text>
        <line x1="735" y1="458" x2="895" y2="458" stroke="#e2e8f0" stroke-width="1" />
        <!-- Methods -->
        <text x="745" y="478" font-size="10" font-family="Consolas, monospace" fill="#334155">+ constructor(w)</text>
        <text x="745" y="498" font-size="10" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process()</text>
      </g>

      <!-- 6. ResizeDecorator -->
      <g filter="url(#shadow)">
        <rect x="915" y="400" width="160" height="150" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
        <rect x="915" y="400" width="160" height="28" rx="6" fill="#f1f5f9" />
        <rect x="915" y="420" width="160" height="8" fill="#f1f5f9" />
        <text x="995" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">ResizeDecorator</text>
        <line x1="915" y1="428" x2="1075" y2="428" stroke="#e2e8f0" stroke-width="1" />
        <!-- Attributes -->
        <text x="925" y="444" font-size="9.5" font-family="Consolas, monospace" fill="#475569">- width: number</text>
        <text x="925" y="456" font-size="9.5" font-family="Consolas, monospace" fill="#475569">- height: number</text>
        <line x1="915" y1="462" x2="1075" y2="462" stroke="#e2e8f0" stroke-width="1" />
        <!-- Methods -->
        <text x="925" y="480" font-size="9.5" font-family="Consolas, monospace" fill="#334155">+ constructor(w,w,h)</text>
        <text x="925" y="498" font-size="10" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process()</text>
      </g>

      <!-- 7. WatermarkDecorator -->
      <g filter="url(#shadow)">
        <rect x="1095" y="400" width="160" height="150" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
        <rect x="1095" y="400" width="160" height="28" rx="6" fill="#f1f5f9" />
        <rect x="1095" y="420" width="160" height="8" fill="#f1f5f9" />
        <text x="1175" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">WatermarkDecorator</text>
        <line x1="1095" y1="428" x2="1255" y2="428" stroke="#e2e8f0" stroke-width="1" />
        <!-- Attributes -->
        <text x="1105" y="444" font-size="9.5" font-family="Consolas, monospace" fill="#475569">- text: string</text>
        <text x="1105" y="456" font-size="9.5" font-family="Consolas, monospace" fill="#475569">- opacity: number</text>
        <line x1="1095" y1="462" x2="1255" y2="462" stroke="#e2e8f0" stroke-width="1" />
        <!-- Methods -->
        <text x="1105" y="480" font-size="9.5" font-family="Consolas, monospace" fill="#334155">+ constructor(w,t,o)</text>
        <text x="1105" y="498" font-size="10" font-family="Consolas, monospace" font-weight="bold" fill="#0f172a">+ process()</text>
      </g>

      <!-- Footer Legend / Key -->
      <g transform="translate(30, 580)">
        <rect x="0" y="0" width="1220" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="20" y="28" font-size="12" font-weight="bold" fill="#334155">UML Legend:</text>
        
        <!-- Realization key -->
        <line x1="120" y1="24" x2="160" y2="24" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-triangle)" />
        <text x="170" y="28" font-size="11" fill="#475569">Realization (implements)</text>

        <!-- Generalization key -->
        <line x1="360" y1="24" x2="400" y2="24" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-triangle)" />
        <text x="410" y="28" font-size="11" fill="#475569">Generalization (extends)</text>

        <!-- Aggregation key -->
        <line x1="600" y1="24" x2="640" y2="24" stroke="#7c3aed" stroke-width="1.8" marker-start="url(#diamond-aggregation)" />
        <text x="655" y="28" font-size="11" fill="#475569">Aggregation (holds wrappee)</text>

        <!-- Stack note -->
        <text x="1000" y="28" font-size="11" font-weight="600" fill="#2563eb">Runtime Stackable Pipeline</text>
      </g>

    </svg>
  </div>

</body>
</html>
